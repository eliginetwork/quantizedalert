[project]
name = "quantizedalert"
version = "0.1.0"
description = "QuantizedAlert — Autonomous Quant Research-to-Alert Revenue Engine. Turn quantitative research into an always-on research and portfolio monitoring system."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    # pyqlib is NOT on PyPI — keep the comment, and add a proper install instruction
    # Install via: uv pip install -e /root/repos/qlib (or your qlib checkout)
    "lightgbm==4.7.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<3",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "jinja2==3.1.6",
    "apscheduler==3.11.3",
    "sqlalchemy>=2.0,<2.1",
    "python-dotenv==1.2.3",
    "dill==0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "coverage==7.16.0",
    "alembic==1.19.2",
    "slowapi==0.1.10",
]
billing = ["stripe==15.6.1"]
llm = ["litellm==1.100.0"]

[project.scripts]
quantizedalert = "quantizedalert.cli:main"
unlockaid = "quantizedalert.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 1200
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = [
    "slow: exercises real qlib training/backtesting (seconds-to-minutes)",
    "asset: proves mandated-asset integration per AGENT_BUILD_PLAYBOOK",
]

[tool.quantizedalert]
qlib_path = "/root/repos/qlib"
dsa_path = "/root/repos/daily_stock_analysis"
# Install qlib separately (not on PyPI):
#   uv pip install -e /path/to/qlib --python .venv/bin/python
# Gate: scripts/asset_smoke_qlib.py must pass before `quantizedalert research`.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "E702", "B905", "E402", "UP042"]

[tool.coverage.run]
source = ["quantizedalert"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
