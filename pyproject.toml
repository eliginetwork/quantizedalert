[project]
name = "unlockaid"
version = "0.1.0"
description = "UnlockAid — Autonomous Quant Research-to-Alert Revenue Engine. Turn quantitative research into an always-on research and portfolio monitoring system."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pyqlib",               # /root/repos/qlib (editable) — research & modeling engine
    "lightgbm",
    "numpy<2.0",
    "pandas>=2.1,<3",
    "pyyaml",
    "requests",
    "fastapi",
    "uvicorn",
    "jinja2",
    "apscheduler",
    "sqlalchemy>=2.0",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout"]

[project.scripts]
unlockaid = "unlockaid.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 1200
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = [
    "slow: exercises real qlib training/backtesting (seconds-to-minutes)",
    "asset: proves mandated-asset integration per AGENT_BUILD_PLAYBOOK",
]

[tool.unlockedaid]
qlib_path = "/root/repos/qlib"
dsa_path = "/root/repos/daily_stock_analysis"
